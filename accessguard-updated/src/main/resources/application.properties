# ============================================================
# AccessGuard Compensation Engine
# Development Configuration (H2 file-mode)
# ============================================================

spring.application.name=compensation-engine

# ============================================================
# H2 FILE-MODE DATABASE
# File mode: data persists across application restarts.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/accessguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / HIBERNATE
# update: creates tables on first run, preserves data after.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================================
# H2 WEB CONSOLE (dev only)
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/accessguard
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# OLLAMA
# ============================================================
ollama.url=http://localhost:11434/api/generate
ollama.model=qwen2.5:1.5b

# ============================================================
# LOGGING
# ============================================================
logging.level.compensation_engine=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
