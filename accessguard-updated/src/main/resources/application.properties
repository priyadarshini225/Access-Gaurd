# ============================================================
# AccessGuard Compensation Engine
# Development Configuration (H2 file-mode)
# ============================================================

spring.application.name=compensation-engine

# ============================================================
# H2 FILE-MODE DATABASE
# File mode: data persists across application restarts.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/accessguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / HIBERNATE
# Flyway owns schema changes; Hibernate validates mappings only.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================================
# FLYWAY
# Existing development databases are marked as baseline version 1.
# Fresh databases execute db/migration/V1__baseline_schema.sql.
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================================
# H2 WEB CONSOLE (dev only)
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/accessguard
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# OLLAMA
# ============================================================
ollama.url=http://localhost:11434/api/generate
ollama.model=qwen2.5:1.5b

# Comma-separated applications handled by the persisted external connector.
# Leave empty to use the database fallback connector for all applications.
connectors.external.applications=

# Expiry processing is disabled by default. Enable in an operational profile.
access.expiry.scheduler.enabled=false
access.expiry.scheduler.delay-ms=300000

# ============================================================
# LOGGING
# ============================================================
logging.level.compensation_engine=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
